name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check release version
        id: version
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "Tag version ($tag_version) must match pubspec.yaml version ($app_version)." >&2
            exit 1
          fi
          echo "value=$app_version" >> "$GITHUB_OUTPUT"

      - name: Check platform imports
        run: dart run tool/check_platform_imports.dart

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi --target lib/main_mobile.dart

      - name: Stage Android release files
        shell: bash
        run: |
          mkdir -p dist/android
          version="${{ steps.version.outputs.value }}"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/android/BearsVideo-${version}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/android/BearsVideo-${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/android/BearsVideo-${version}-android-x86_64.apk"

      - name: Upload Android release files
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)'
          if (-not $versionLine) {
            throw 'Could not read the version from pubspec.yaml.'
          }
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $appVersion) {
            throw "Tag version ($tagVersion) must match pubspec.yaml version ($appVersion)."
          }
          "value=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Check platform imports
        run: dart run tool/check_platform_imports.dart

      - name: Build Windows app
        run: flutter build windows --release --target lib/main_desktop.dart

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --yes --no-progress
          }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          $installerScript = (Resolve-Path 'installer\bears_video.nsi').Path
          & $makensis "/DAPP_VERSION=$version" "/DAPP_VERSION_NUMERIC=$version.0" $installerScript
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE."
          }
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          Move-Item "installer\BearsVideo-$version-windows-x64-setup.exe" dist\windows\

      - name: Upload Windows release file
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - android
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
